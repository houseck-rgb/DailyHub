<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>시재 - 아침 시재 보고</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" />
  <meta name="theme-color" content="#A9824F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="시재" />
  <meta name="mobile-web-app-capable" content="yes" />

  <style>
    html, body { margin: 0; padding: 0; background: #FAF9F6; }
    #root { min-height: 100vh; }
  </style>

  <!-- React / ReactDOM / Babel (브라우저에서 바로 JSX 실행) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js" crossorigin></script>
</head>
<body>
  <div id="root"></div>

  <script src="storage-shim.js"></script>
  <script type="text/babel" data-presets="react" src="app.jsx"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("service-worker.js").catch(function (err) {
          console.warn("서비스워커 등록 실패:", err);
        });
      });
    }
  </script>
</body>
</html>
